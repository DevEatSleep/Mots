<style>

  body {

    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    transition: background 0.4s ease, color 0.4s ease;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px 32px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.6s ease forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .word {
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 6px;
    line-height: 1.15;
  }
  .rule {
    width: 48px;
    height: 2px;
    background: var(--accent-soft);
    margin: 18px auto 18px;
    border: none;
  }
  .definition {
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    margin: 0 0 22px;
  }
  .date {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
  }
  .footer {
    margin-top: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .count {
    opacity: 0.7;
  }
</style>
</head>

  // PRNG déterministe (mulberry32), pour mélanger la liste de façon reproductible
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Mélange déterministe de la liste, propre à chaque année (même seed => même ordre pour tout le monde)
  function shuffledForYear(year, arr) {
    const seed = Math.imul(year, 2654435761) >>> 0;
    const rng = mulberry32(seed);
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Numéro du jour dans l'année (0-based), sur la date locale du visiteur
  function dayOfYear(date) {
    const start = new Date(date.getFullYear(), 0, 1);
    const diffDays = Math.floor((date - start) / 86400000);
    return diffDays;
  }

  const now = new Date();
  const year = now.getFullYear();
  const shuffled = shuffledForYear(year, WORDS);
  const doy = dayOfYear(now);
  const idx = doy % shuffled.length;
  const entry = shuffled[idx];

  document.getElementById("word").textContent = entry.mot;
  document.getElementById("definition").textContent = entry.definition;
  document.getElementById("dayIndex").textContent = `Jour ${doy + 1} de ${year} — ${WORDS.length} mots au total`;

  const dateStr = now.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  document.getElementById("date").textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
